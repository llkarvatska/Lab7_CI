name: Lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Отримання коду
        uses: actions/checkout@v4

      - name: Налаштування Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Встановлення залежностей
        run: npm install

      - name: Запуск тестів
        run: npm test